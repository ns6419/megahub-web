<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGAHUB</title>
    <meta name="author" content="HADI">
    <meta name="owner" content="HADI">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            text-transform: uppercase;
            font-weight: 950;
            letter-spacing: 2px;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }
        body {
            position: relative;
            padding: 30px 20px 120px 20px;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
            touch-action: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
        .interactive-layer {
            pointer-events: auto;
        }
        header {
            text-align: center;
            margin: 40px 0 30px 0;
        }
        header h1 {
            font-size: 3rem;
            letter-spacing: 8px;
        }
        .subtitle {
            font-size: 0.65rem;
            color: #555;
            margin-top: 10px;
            letter-spacing: 3px;
            font-weight: 700;
        }
        .btn-main-action {
            display: block;
            background: transparent;
            color: #fff;
            text-align: center;
            padding: 16px;
            border: 2px solid #fff;
            text-decoration: none;
            border-radius: 40px;
            margin: 30px 0 40px 0;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .btn-main-action:active {
            background: #fff;
            color: #000;
        }
        .section-title {
            font-size: 0.85rem;
            border-left: 4px solid #fff;
            padding-left: 12px;
            margin: 40px 0 20px 0;
            letter-spacing: 3px;
        }
        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .option-card {
            background: rgba(5, 5, 5, 0.75);
            border: 2px solid #222;
            padding: 24px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:active {
            border-color: #fff;
            transform: scale(0.97);
            background: rgba(20, 20, 20, 0.9);
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .card-icon-frame {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-icon-frame svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }
        .card-text h3 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #fff;
        }
        .card-text p {
            color: #555;
            font-size: 0.65rem;
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .arrow-frame {
            width: 24px;
            height: 24px;
        }
        .arrow-frame svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #444;
            stroke-width: 2.5;
            transition: stroke 0.3s;
        }
        .option-card:active .arrow-frame svg {
            stroke: #fff;
        }
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .slide-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #050505;
            border-top: 2px solid #ffffff;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 35px 24px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            max-height: 85vh;
            overflow-y: auto;
        }
        .slide-drawer.active {
            transform: translateY(0);
        }
        .drawer-header {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .logo-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 4px 20px 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .logo-grid::-webkit-scrollbar {
            display: none;
        }
        .logo-item {
            background: #000;
            border: 2px solid #222;
            border-radius: 14px;
            padding: 18px 24px;
            cursor: pointer;
            flex-shrink: 0;
            color: #555;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .logo-item.selected {
            border-color: #fff;
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }
        label {
            display: block;
            font-size: 0.7rem;
            margin: 20px 0 10px 0;
            color: #888;
        }
        input, textarea {
            width: 100%;
            padding: 16px;
            background: #000;
            border: 2px solid #222;
            color: #fff;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #fff;
            outline: none;
        }
        textarea {
            resize: none;
            height: 100px;
            text-transform: none;
            font-weight: 500;
        }
        input {
            text-transform: none;
            font-weight: 500;
        }
        .btn-submit {
            background: #fff;
            color: #000;
            padding: 18px;
            border-radius: 40px;
            border: none;
            width: 100%;
            margin-top: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn-submit:active {
            transform: scale(0.97);
        }
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 998;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .whatsapp-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }
    </style>
</head>
